[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evo"
version = "0.1.0"
description = "Harness evolution and simplification experiments"
requires-python = ">=3.11"
dependencies = [
    "radon==6.0.1",
    "PyYAML>=6.0",
    "filelock>=3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["evo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
